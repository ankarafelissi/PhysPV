# Single reproducible experiment configuration.
seed: 11

tuning:
  trials_per_space: 40
  pre_choices: [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 60, 70, 80, 90, 100, 110, 120]
  startup_trials: 10

data:
  path: data/raw/SOLETE_Pombo_5min.h5
  processed_path: data/processed/solete_5min_features.h5
  resolution: 5min
  target: P_Solar[kW]
  features: ["P_Solar[kW]"]
  pre: 30
  horizon: 60
  split: [0.7, 0.2, 0.1]
  scaler: MinMax01
  correct_power: true
  power_correction:
    # Explicit interpretation of the paper's >20% deviation rule.
    relative_deviation: 0.2
    minimum_pac_kw: 0.05
    zero_floor_kw: 0.001
  evaluation:
    daylight_only: true
    normalization_kw: 10.0
  physics: false
  candidate_subset: []
  ratio_floors:
    pac_kw: 0.05
    clear_ghi_kw_m2: 0.02
  solar:
    # SOLETE / SYSLAB, DTU Ris酶, Roskilde, Denmark
    site:
      latitude: 55.6867
      longitude: 12.0985
      timezone: UTC

  p_nom_kw: 7.2
  plant_path: config/plant.yaml
  constraints:
    nonnegative: true
    capacity: false

model: CNN_LSTM
models:
  CNN_LSTM:
    epochs: 1000
    batch_size: 16
    filters: 32
    kernel_size: 3
    pool_size: 2
    neurons: [10, 10]
    dense_neurons: []
    cnn_activation: tanh
    lstm_activation: tanh
    output_activation: linear
    loss: mean_absolute_error
    optimizer:
      name: adam
      learning_rate: 0.0007
      clipnorm: 1.0
    patience: 20
    verbose: 0
  XGBoost:
    n_estimators: 700
    max_depth: 4
    learning_rate: 0.03
    subsample: 0.9
    colsample_bytree: 0.9
    min_child_weight: 3
    reg_lambda: 2.0
    objective: reg:squarederror
    tree_method: gpu_hist
    n_jobs: 2
    early_stopping_rounds: 40

output_dir: outputs

study:
  bootstrap_resamples: 2000
  bootstrap_seed: 2026
  bootstrap_block_length: 288
  min_test_origins: 500

experiment:
  # Absolute contemporaneous target correlation, fitted on TRAIN only.
  pearson_threshold: 0.7
  pearson_force_include: ["HUMIDITY[%]"]
