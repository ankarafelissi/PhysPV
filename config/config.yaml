# Single reproducible experiment configuration.
seed: 11

data:
  path: data/raw/SOLETE_Pombo_60min.h5
  processed_path: data/processed/solete_hourly_features.h5
  resolution: 60min
  target: P_Solar[kW]
  features:
    - TEMPERATURE[degC]
    - HUMIDITY[%]
    - WIND_SPEED[m1s]
    - P_Solar[kW]
  pre: 24
  horizon: 10
  split: [0.7, 0.2, 0.1]
  scaler: MinMax01
  correct_power: false
  physics: false
  candidate_subset: []
  p_nom_kw: 7.44
  plant_path: config/plant.yaml
  constraints:
    nonnegative: true
    capacity: false

model: CNN_LSTM
models:
  CNN_LSTM:
    epochs: 120
    batch_size: 16
    filters: 16
    kernel_size: 3
    neurons: [32]
    cnn_activation: tanh
    lstm_activation: tanh
    output_activation: linear
    loss: mean_absolute_error
    optimizer:
      name: adam
      learning_rate: 0.0007
      clipnorm: 1.0
    patience: 12
    verbose: 0
  XGBoost:
    n_estimators: 700
    max_depth: 4
    learning_rate: 0.03
    subsample: 0.9
    colsample_bytree: 0.9
    min_child_weight: 3
    reg_lambda: 2.0
    objective: reg:squarederror
    tree_method: hist
    n_jobs: 2
    early_stopping_rounds: 40

output_dir: outputs

study:
  bootstrap_resamples: 2000
  bootstrap_seed: 2026
  bootstrap_block_length: 24
  min_test_origins: 500

experiment:
  reference_features: ['POA Irr[kW1m2]', 'GHI[kW1m2]', HoursOfDay]
  physics_candidates:
    - id: add_pac
      add: [Pac]
    - id: add_pdc
      add: [Pdc]
    - id: add_tm
      add: [TempModule]
    - id: add_tc
      add: [TempCell]
    - id: add_pac_tc
      add: [Pac, TempCell]
    - id: add_pdc_tc
      add: [Pdc, TempCell]
    - id: add_all_physics
      add: [Pac, Pdc, TempModule, TempCell]
